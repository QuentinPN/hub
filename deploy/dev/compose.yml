# PostgreSQL de développement, sur ce poste uniquement. Rien à voir avec le homelab :
# le mot de passe ne sert qu'ici et le port n'écoute que sur la boucle locale.
#   docker compose -f deploy/dev/compose.yml up -d
name: hub-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub-dev-only
      POSTGRES_DB: hub
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub -d hub']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
