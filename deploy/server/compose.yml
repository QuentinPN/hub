# Serveur Hub et sa base PostgreSQL. Lire deploy/server/README.md avant de lancer.
#
#   docker compose --env-file deploy/server/.env -f deploy/server/compose.yml up -d
name: hub

services:
  db:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    networks: [db]
    read_only: true
    tmpfs: [/run/postgresql, /tmp]
    # Le lancement de l'image a besoin de ces droits pour passer à l'utilisateur postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${HUB_DB_PASSWORD:?HUB_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub -d hub']
      interval: 5s
      timeout: 3s
      retries: 20

  hub:
    image: hub-server:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    environment:
      HUB_ADDR: :8080
      HUB_DATABASE_URL: postgres://hub:${HUB_DB_PASSWORD:?HUB_DB_PASSWORD}@db:5432/hub?sslmode=disable
      HUB_SECRET_KEY_FILE: /var/lib/hub/secrets.key
      HUB_ORIGIN: https://${HUB_DOMAIN:?HUB_DOMAIN}:8444
      HUB_AGENT_CA_FILE: /var/lib/hub/agent-ca.pem
      HUB_AGENT_ADDR: :8443
      HUB_AGENT_NAMES: ${HUB_AGENT_NAMES:?HUB_AGENT_NAMES}
      # Sauvegardes : un partage du QNAP monté sur l'hôte (docs/EXPLOITATION.md), jamais créé ici.
      HUB_BACKUP_DIR: /sauvegardes
      # Fuseau du créneau de 03:00.
      TZ: ${TZ:-Europe/Paris}
    # Seul le port agents est publié, sur une seule IP. L'UI ne se joint que par le Caddy ci-dessous.
    ports:
      - '${HUB_BIND:?HUB_BIND}:8443:8443'
    networks: [db, edge]
    volumes:
      - keys:/var/lib/hub
      # Jamais créé par Docker : un partage absent fait échouer le démarrage, pas une copie locale.
      - type: bind
        source: ${HUB_BACKUP_HOST_DIR:?HUB_BACKUP_HOST_DIR, le partage du QNAP monté sur l'hôte}
        target: /sauvegardes
        bind:
          create_host_path: false
    healthcheck:
      test: ['CMD', '/hub-server', '-healthcheck']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: hub-caddy:local
    restart: unless-stopped
    depends_on: [hub]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?HUB_DOMAIN}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN}
    ports:
      - '${HUB_BIND:?HUB_BIND}:8444:8444'
    networks: [edge]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  # La base ne sort pas et n'est jointe que par le serveur.
  db:
    internal: true
  # Ports publiés, accès sortant (icônes, certificat), agent de ce même hôte.
  edge:
    name: hub-edge

volumes:
  pgdata:
  # Clé des secrets et AC des agents, à part de la base. À sauvegarder à part aussi.
  keys:
  # Certificat : se réobtient tout seul, inutile à sauvegarder.
  caddy-data:
  caddy-config:
